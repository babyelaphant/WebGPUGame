<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>untitled-01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <link data-trunk rel="rust" data-wasm-opt="z" />
  <link data-trunk rel="copy-dir" href="assets" />
  <link rel="stylesheet" href="assets/menu.css" />
  <style>
    :root {
      --ink: #f4ead8;
      --ink-dim: #bfae98;
      --panel: rgba(24, 14, 38, 0.72);
      --panel-edge: rgba(255, 190, 110, 0.35);
      --accent: #ffb454;
      --accent-2: #b48cff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0614; }
    body { font-family: "Fredoka", system-ui, sans-serif; color: var(--ink); user-select: none; }
    canvas#gpu { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }

    #hud { position: fixed; inset: 0; pointer-events: none; font-size: 15px; }
    .panel {
      background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 14px;
      padding: 10px 14px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.35);
    }
    .panel:empty { display: none; }

    .fc { color: #ffd9a0; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
    #hud-top { position: absolute; top: 16px; left: 16px; display: flex; gap: 10px; align-items: stretch; }
    #hud-clock b { font-size: 22px; color: var(--accent); margin-right: 6px; }
    #hud-candles { font-size: 20px; font-weight: 600; }

    #hud-followers { position: absolute; top: 16px; right: 16px; text-align: right; }
    #hud-followers .f { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }

    #hud-toasts { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; }
    #hud-toasts div { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 999px; padding: 6px 16px; }

    #hud-prompt { position: absolute; bottom: 112px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 520px; }
    #hud-prompt small { color: var(--ink-dim); }

    #hud-hotbar { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 8px; }
    .slot { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; border: 2px solid transparent; background: rgba(255,255,255,.05); }
    .slot.sel { border-color: var(--accent); background: rgba(255,180,84,.14); }
    .slot i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }
    .slot b { margin-left: 4px; color: var(--accent); }

    #hud-shop { position: absolute; left: 16px; bottom: 16px; width: 330px; }
    #hud-shop h3, #hud-journal h3 { margin: 0 0 6px; font-weight: 600; color: var(--accent); }
    .up { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; padding: 4px 0; }
    .up small { display: block; color: var(--ink-dim); }
    kbd { background: rgba(255,255,255,.12); border-radius: 6px; padding: 1px 7px; font-family: inherit; }

    /* Spirit journal: a notebook with one cream page per area */
    #hud-journal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(1100px, 95vw); max-height: 90vh; overflow: auto; padding: 16px 18px 18px;
      background: linear-gradient(180deg, #3c2536, #2a1a2e); border-color: rgba(255, 190, 110, .45);
    }
    .book-head { display: flex; align-items: baseline; gap: 18px; margin-bottom: 10px; }
    .book-head h3 { margin: 0; font-size: 26px; }
    .book-head .keys { margin-left: auto; color: var(--ink-dim); font-size: 14px; }
    .tabs { display: flex; gap: 6px; }
    .tabs .tab { padding: 7px 16px; border-radius: 12px 12px 0 0; background: rgba(255, 255, 255, .07); color: var(--ink-dim); }
    .tabs .tab small { opacity: .75; margin-left: 4px; }
    .tabs .tab.on { background: #f6ecd2; color: #4a3a2c; font-weight: 600; }
    .cards {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 14px;
      background: #f6ecd2; border-radius: 0 14px 14px 14px; color: #4a3a2c;
    }
    .card {
      position: relative; padding: 10px 10px 12px; border-radius: 10px; background: #fffaf0;
      border: 1px solid #e3d4ae; box-shadow: 0 2px 0 rgba(120, 90, 50, .16);
    }
    .card.complete::after {
      content: "complete!"; position: absolute; bottom: 8px; right: 10px; transform: rotate(-6deg);
      font: 700 20px "Caveat", cursive; color: #5a8f4a; border: 2px solid #5a8f4a; border-radius: 8px; padding: 0 8px; opacity: .85;
    }
    .card .sketch { width: 100%; max-width: 168px; margin: 0 auto; aspect-ratio: 1 / 1; }
    .card .sketch svg { width: 100%; height: 100%; display: block; }
    .card .nm { display: block; text-align: center; font-size: 18px; margin-top: 2px; }
    .card .stars { text-align: center; color: #d79a2b; letter-spacing: 3px; font-size: 15px; }
    .card.unseen .nm { color: #b9a584; }
    .card.unseen .stars { color: #d9ccb0; }
    .notes { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13.5px; line-height: 1.32; }
    .notes li { padding: 5px 0; border-top: 1px dashed #e3d4ae; }
    .notes .hint { font-style: italic; color: #7a6650; border-top: none; }
    .notes .todo { color: #a89877; font: 500 17px/1.15 "Caveat", cursive; }
    .notes .got em { color: #8a5a2a; }
    .notes .dot { vertical-align: -1px; margin-right: 3px; box-shadow: none; }

    #hud-sense { position: absolute; top: 88px; left: 16px; max-width: 360px; }
    #hud-sense .arrow { display: inline-block; font-size: 22px; line-height: 1; color: var(--accent); margin-right: 4px; animation: pulse 2.2s ease-in-out infinite; }
    #hud-book { font-size: 17px; font-weight: 500; display: flex; align-items: center; }
    #hud-candles { display: flex; align-items: center; }
    #hud-book .newnote { color: #ffe09a; animation: pulse 1.8s ease-in-out infinite; }
    #hud-fps { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font: 12px/1.2 ui-monospace, monospace; padding: 4px 10px; }
    body.no-hints #hud-help { display: none; }

    #hud-debug { position: absolute; bottom: 16px; right: 16px; font: 12px/1.4 ui-monospace, monospace; white-space: pre; }
    #hud-help { position: absolute; right: 16px; bottom: 16px; color: var(--ink-dim); font-size: 12px; text-align: right; opacity: .75; }

    #error {
      display: none; position: fixed; inset: 0; z-index: 10; padding: 15vh 10vw; text-align: center;
      background: #120a1f; color: var(--ink); font-size: 20px; line-height: 1.5;
    }
  </style>
</head>
<body>
  <canvas id="gpu"></canvas>
  <div id="hud">
    <div id="hud-top">
      <div class="panel" id="hud-clock"></div>
      <div class="panel" id="hud-candles"></div>
      <div class="panel" id="hud-book"></div>
    </div>
    <div class="panel" id="hud-sense"></div>
    <div class="panel" id="hud-fps"></div>
    <div class="panel" id="hud-followers"></div>
    <div id="hud-toasts"></div>
    <div class="panel" id="hud-prompt"></div>
    <div class="panel" id="hud-hotbar"></div>
    <div class="panel" id="hud-shop"></div>
    <div class="panel" id="hud-journal"></div>
    <div class="panel" id="hud-debug"></div>
    <div id="hud-help">WASD move · Shift run · E interact · Space drop treat · Q / R switch treat · J journal · M sound · Esc menu · F1 debug</div>
  </div>
  <div id="menu" class="menu"></div>
  <div id="error"></div>
  <script src="assets/audio.js"></script>
  <script src="assets/menu.js"></script>
</body>
</html>
