<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>untitled-01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link data-trunk rel="rust" data-wasm-opt="z" />
  <link data-trunk rel="copy-dir" href="assets" />
  <link rel="stylesheet" href="assets/menu.css" />
  <style>
    :root {
      --ink: #f6e6c4;
      --ink-dim: #a894c8;
      --night: #1c1530;
      --gold: #e8b45a;
      --bronze: #8a5a2a;
      --panel: #1c1530;
      --panel-edge: #e8b45a;
      --accent: #e8b45a;
      --accent-2: #b48cff;
      --font-body: "VT323", ui-monospace, monospace;
      --font-head: "Press Start 2P", ui-monospace, monospace;
      /* Double-line RPG window: dark gap, gold line, dark gap, bronze line, hard shadow. */
      --dbl: 0 0 0 3px var(--night), 0 0 0 6px var(--gold), 0 0 0 9px var(--night), 0 0 0 12px var(--bronze), 0 12px 0 12px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; border-radius: 0; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0614; }
    body { font-family: var(--font-body); font-size: 22px; color: var(--ink); user-select: none; }
    canvas#gpu { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }

    #hud { position: fixed; inset: 0; pointer-events: none; font-size: 22px; line-height: 1.12; }
    .panel { background: var(--panel); padding: 10px 16px 11px; box-shadow: var(--dbl); }
    .panel:empty { display: none; }

    .fc { color: #ffd27a; animation: pulse 1.6s steps(2) infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
    #hud-top { position: absolute; top: 28px; left: 28px; display: flex; gap: 28px; align-items: stretch; }
    #hud-clock b { font: 400 18px var(--font-head); color: var(--gold); margin-right: 10px; }
    #hud-candles { font-size: 30px; }

    #hud-followers { position: absolute; top: 28px; right: 28px; text-align: right; }
    #hud-followers .f { display: inline-flex; align-items: center; gap: 8px; margin-left: 12px; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 0; box-shadow: 0 0 0 3px var(--night); }

    #hud-toasts { position: absolute; top: 112px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 24px; align-items: center; }
    #hud-toasts div { background: #f6e6c4; color: #2a1d3a; padding: 6px 20px 7px; box-shadow: 0 0 0 3px var(--night), 0 0 0 6px var(--bronze), 0 8px 0 6px rgba(0,0,0,.3); }

    #hud-prompt { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 560px; padding: 14px 24px 16px; }
    #hud-prompt small { color: var(--ink-dim); font-size: 20px; }

    #hud-hotbar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; padding: 10px; }
    .slot { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #2d2348; color: var(--ink); }
    .slot.sel { background: var(--gold); color: var(--night); }
    .slot i { width: 16px; height: 16px; border-radius: 0; display: inline-block; box-shadow: 0 0 0 3px var(--night); }
    .slot b { margin-left: 4px; color: inherit; font-weight: 400; }

    #hud-shop { position: absolute; left: 28px; bottom: 30px; width: 380px; }
    #hud-shop h3, #hud-journal h3 { margin: 0 0 10px; font: 400 14px var(--font-head); color: var(--gold); }
    .up { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 4px 0; }
    .up small { display: block; color: var(--ink-dim); font-size: 19px; }
    kbd { background: var(--gold); color: var(--night); padding: 0 7px; font-family: inherit; }

    /* Spirit journal: a night-blue window holding cream notebook pages */
    #hud-journal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(1100px, 92vw); max-height: 86vh; overflow: auto; padding: 18px 20px 20px;
    }
    .book-head { display: flex; align-items: baseline; gap: 18px; margin-bottom: 14px; }
    .book-head h3 { margin: 0; font-size: 16px; }
    .book-head .keys { margin-left: auto; color: var(--ink-dim); font-size: 20px; }
    .tabs { display: flex; gap: 8px; }
    .tabs .tab { padding: 5px 16px 6px; background: #2d2348; color: var(--ink-dim); }
    .tabs .tab small { opacity: .8; margin-left: 6px; }
    .tabs .tab.on { background: var(--gold); color: var(--night); }
    .cards {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding: 14px;
      background: #f6e6c4; color: #3a2a3a; box-shadow: inset 0 0 0 4px #d9c498;
    }
    .card { position: relative; padding: 10px 10px 44px; background: #fff6df; box-shadow: 0 0 0 3px var(--night); }
    .card.complete::after {
      content: "COMPLETE"; position: absolute; bottom: 8px; right: 10px;
      font: 400 11px var(--font-head); color: #3f7a3a; box-shadow: 0 0 0 2px #3f7a3a; padding: 4px 6px; background: #fff6df;
    }
    .card .sketch { width: 100%; max-width: 168px; margin: 0 auto; aspect-ratio: 1 / 1; }
    .card .sketch svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .card .nm { display: block; text-align: center; font: 400 12px var(--font-head); margin: 6px 0 4px; }
    .card .stars { text-align: center; color: #c8861a; letter-spacing: 4px; font-size: 22px; }
    .card.unseen .nm { color: #a79a82; }
    .card.unseen .stars { color: #d9ccb0; }
    .notes { list-style: none; margin: 8px 0 0; padding: 0; font-size: 20px; line-height: 1.1; }
    .notes li { padding: 5px 0; border-top: 2px dotted #d9c498; }
    .notes .hint { color: #7a6650; border-top: none; }
    .notes .todo { color: #a79a82; }
    .notes .got em { color: #a05a14; font-style: normal; }
    .notes .dot { vertical-align: 0; margin-right: 6px; box-shadow: none; }

    #hud-sense { position: absolute; top: 120px; left: 28px; max-width: 400px; }
    #hud-sense .arrow { display: inline-block; font-size: 26px; line-height: 1; color: var(--gold); margin-right: 6px; animation: pulse 2.2s steps(2) infinite; }
    #hud-book { font-size: 24px; display: flex; align-items: center; }
    #hud-candles { display: flex; align-items: center; }
    #hud-book .newnote { color: #ffd27a; animation: pulse 1.8s steps(2) infinite; }
    #hud-fps { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); font: 18px/1.2 var(--font-body); padding: 2px 10px; }
    body.no-hints #hud-help { display: none; }

    #hud-debug { position: absolute; bottom: 30px; right: 28px; font: 16px/1.3 ui-monospace, monospace; white-space: pre; }
    #hud-ending { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(12,8,24,.78); animation: endfade 1.2s ease-out; z-index: 20; }
    #hud-ending:empty { display: none; }
    @keyframes endfade { from { opacity: 0; } to { opacity: 1; } }
    .end-card { background: var(--panel); box-shadow: var(--dbl); padding: 34px 44px 26px; width: min(640px, 80vw); text-align: center; }
    .end-star { color: var(--gold); font: 400 28px var(--font-head); margin-bottom: 14px; }
    .end-card h2 { margin: 0 0 16px; font: 400 18px/1.5 var(--font-head); color: var(--gold); }
    .end-body { font-size: 26px; line-height: 1.2; }
    .end-body .roll { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; margin-top: 16px; font-size: 22px; }
    .end-pages { color: var(--ink-dim); font-size: 20px; margin-top: 20px; }
    .end-hint { color: var(--gold); font-size: 22px; margin-top: 4px; }
    #hud-help { position: absolute; right: 28px; bottom: 30px; color: var(--ink-dim); font-size: 19px; text-align: right; opacity: .85; max-width: 340px; line-height: 1.2; }

    #error {
      display: none; position: fixed; inset: 0; z-index: 10; padding: 15vh 10vw; text-align: center;
      background: #120a1f; color: var(--ink); font-size: 26px; line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="gpu"></canvas>
  <div id="hud">
    <div id="hud-top">
      <div class="panel" id="hud-clock"></div>
      <div class="panel" id="hud-candles"></div>
      <div class="panel" id="hud-book"></div>
    </div>
    <div class="panel" id="hud-sense"></div>
    <div class="panel" id="hud-fps"></div>
    <div class="panel" id="hud-followers"></div>
    <div id="hud-toasts"></div>
    <div class="panel" id="hud-prompt"></div>
    <div class="panel" id="hud-hotbar"></div>
    <div class="panel" id="hud-shop"></div>
    <div class="panel" id="hud-journal"></div>
    <div id="hud-ending"></div>
    <div class="panel" id="hud-debug"></div>
    <div id="hud-help">WASD move · Shift run · E interact · Space drop treat · Q / R switch treat · J journal · M sound · Esc menu · F1 debug</div>
  </div>
  <div id="menu" class="menu"></div>
  <div id="error"></div>
  <script src="assets/audio.js"></script>
  <script src="assets/menu.js"></script>
</body>
</html>
